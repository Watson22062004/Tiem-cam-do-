<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiệm Cầm Đồ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#1c1228;display:flex;justify-content:center;align-items:center;
font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;width:min(100vw,390px);height:min(100vh,780px);background:#2a1a38;overflow:hidden;
box-shadow:0 0 60px rgba(0,0,0,.6);border-radius:0}
canvas{display:block;width:100%;height:100%}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);
background:#3a2a50;color:#fff;padding:10px 16px;border-radius:16px;font-size:12px;font-weight:600;
opacity:0;transition:all .25s;pointer-events:none;z-index:80;max-width:85%;text-align:center;
border:2px solid #e8a060}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:absolute;inset:0;background:rgba(20,10,30,.7);display:none;align-items:center;justify-content:center;z-index:90}
#modal.show{display:flex}
#modal .box{background:#fff5e8;border-radius:18px;padding:18px;width:88%;max-width:300px;border:3px solid #e8a060}
#modal h3{font-size:15px;color:#4a2a38;margin-bottom:10px;text-align:center}
#modal input{width:100%;padding:11px;border:2px solid #e0c0a0;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:12px;outline:none}
#modal .btns{display:flex;gap:8px}
#modal button{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
#modal .ok{background:#5aba88;color:#fff}
#modal .no{background:#e8d0c0;color:#5a4a48}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="modal"><div class="box"><h3>✏️ Tên tiệm</h3>
<input id="ni" maxlength="16" placeholder="Tên tiệm của bạn">
<div class="btns"><button class="ok" id="mok">Lưu</button><button class="no" id="mno">Hủy</button></div>
</div></div>
</div>
<script>
// ============================================================
// TIỆM CẦM ĐỒ v10 — UI 2D cute nhiều màu · Mặc cả nhiều vòng

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr;
function resize(){
  const r=document.getElementById('app').getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1,2);
  W=Math.round(r.width);H=Math.round(r.height);
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

const MATS=[

];
const TOOLS=[
  {id:'screwdriver',name:'Bộ tua vít',price:180},{id:'loupe',name:'Kính lúp',price:220},
  {id:'solder',name:'Mỏ hàn',price:280},{id:'needle',name:'Kim chỉ',price:90},{id:'tuner',name:'Máy lên dây',price:200}
];
const FAC=[
  {id:'shelf',name:'Tủ trưng',max:3,costs:[350,550,850],detail:['+1 chỗ','+2 chỗ','+2 chỗ'],add:[1,2,2]},
  {id:'counter',name:'Quầy khách',max:2,costs:[450,750],detail:['+1 ô','+1 ô'],add:[1,1]},
  {id:'storage',name:'Kệ kho',max:3,costs:[280,480,750],detail:['Kho 10','14','18'],add:[4,4,4]},
  {id:'led',name:'Đèn LED',max:2,costs:[220,420],detail:['+15% đợi','+30%'],mul:[1.15,1.3]},
  {id:'sign',name:'Biển hiệu',max:2,costs:[380,650],detail:['+20% khách','+40%'],mul:[1.2,1.4]},
  {id:'ac',name:'Máy lạnh',max:1,costs:[900],detail:['+25% đợi'],mul:[1.25]},
  {id:'plant',name:'Cây xanh',max:1,costs:[160],detail:['+uy tín']}
];
const SHOP_LV=[
  {lvl:1,name:'Tiệm nhỏ',needM:0,needR:0},
  {lvl:2,name:'Tiệm cầm đồ',needM:3000,needR:3.5},
  {lvl:3,name:'Tiệm + xưởng',needM:7000,needR:4.0},
  {lvl:4,name:'Tiệm đồ cổ',needM:14000,needR:4.3}
];
const TRAITS=[{id:'nice',l:'Dễ tính',w:1.4,h:.55},{id:'rush',l:'Vội',w:.65,h:1.4},{id:'collect',l:'Sưu tầm',w:1.5,h:.45},{id:'tough',l:'Khó tính',w:.8,h:1.5},{id:'friend',l:'Thân',w:1.3,h:.7},{id:'poor',l:'Cần tiền',w:1.0,h:1.1},{id:'rich',l:'Khá giả',w:1.2,h:.5}];
const NAMES=['Minh','Lan','Hùng','Mai','Tuấn','Hoa','Đức','Thảo','Nam','Linh','Phong','Trang','An','Chi','Bình','Yến','Khoa','Ngọc','Hải','Vy','Khôi','My'];
const RV={5:['Đỉnh 🔥','Xịn sò!','10/10 bestie','Phê vãi'],4:['Ổn áp','Nice!','Khá ok'],3:['Cũng được','Bình thường'],2:['Hơi lấn cấn','Chờ lâu'],1:['Thất vọng','Waste time']};
const DIAL={sell:['Muốn bán món này.','Nhận đồ cũ không?','Cần tiền, bán cái này.'],pawn:['Cầm giúp với.','Cho cầm tạm nhé.','Cần tiền gấp!'],buy:['Có gì hay không?','Cho xem đồ trưng.','Tìm đồ cổ...'],repair:['Sửa giúp với.','Hỏng rồi, nhận sửa?','Nhờ sửa giúp.']};
const EVENTS=[{t:'Khu phố vắng.',m:.5},{t:'Đông vui!',m:1.35},{t:'Tin đồ cổ.',m:1.25,rare:1},{t:'Nhiều người cần tiền.',m:1.3},{t:'Ngày yên ả.',m:.95},{t:'Mưa, ít khách.',m:.45}];

const rand=(a,b)=>Math.random()*(b-a)+a,ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[ri(0,a.length-1)];

const S={
  screen:'home',shopName:'Tiệm Cầm Đồ',
  day:1,money:2500,time:8,open:0,shopLvl:1,skill:1.2,
  customers:[],inv:[],display:[],mats:{},tools:{screwdriver:1},fac:{},
  deal:null,bubbles:[],repair:null,
  stats:{rev:0,cost:0,mat:0,cust:0,deals:0,sold:0,repairs:0,fails:0},
  event:null,reviews:[],market:[],
  particles:[],anim:0,musicOn:1,audio:null,nodes:null,
  closedTab:'hub',drag:null,_tab:'mats',
  scroll:0, // list scroll
  handX:0,handY:0,handVis:0 // repair hand anim
};
MATS.forEach(m=>S.mats[m.k]=m.lvl===1?ri(4,7):0);
FAC.forEach(f=>S.fac[f.id]=0);

function avgStars(){if(!S.reviews.length)return 3.5;return S.reviews.reduce((a,r)=>a+r.stars,0)/S.reviews.length;}
function rep(){return clamp(avgStars(),0,5);}
function maxDisp(){let n=3,lv=S.fac.shelf||0;for(let i=0;i<lv;i++)n+=(FAC[0].add[i]||0);return n;}
function maxSlots(){let n=2,lv=S.fac.counter||0;for(let i=0;i<lv;i++)n+=(FAC[1].add[i]||0);return n;}
function maxInv(){let n=6,lv=S.fac.storage||0;for(let i=0;i<lv;i++)n+=(FAC[2].add[i]||0);return n;}
function waitM(){let m=1;if(S.fac.led)m*=FAC[3].mul[(S.fac.led||1)-1]||1;if(S.fac.ac)m*=1.25;return m;}
function spawnM(){return S.fac.sign?(FAC[4].mul[(S.fac.sign||1)-1]||1):1;}
function unlocked(){return ITEMS.filter(i=>i.lvl<=S.shopLvl);}
function uMats(){return MATS.filter(m=>m.lvl<=S.shopLvl);}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)S.particles.push({x,y,vx:rand(-50,50),vy:rand(-70,-10),life:rand(.3,.9),max:1,s:rand(2,5),col:c});}
function bubble(c,t,d=3){S.bubbles.push({c,text:t,life:d,max:d});}
function genItem(rare){
  const pool=unlocked().filter(i=>!rare||i.rare>=2);const list=pool.length?pool:unlocked();
  const def=list[ri(0,list.length-1)];
  const cond=rand(.32,.88);let mult=rand(.9,1.12),fake=0;
  if(Math.random()<.1){fake=1;mult*=.22;}else if(Math.random()<.07)mult*=2.3;
  const market=Math.floor(def.base*cond*mult);
  return{uid:Date.now()+ri(0,9999),...def,condition:Math.round(cond*100),shown:fake?Math.min(95,Math.round(cond*100)+ri(12,25)):Math.round(cond*100),market,cost:0,repaired:0,isPawn:0,daysLeft:0,owner:'',fake,appraised:0};
}
function refreshM(){S.market=unlocked().map(d=>({id:d.id,name:d.name,price:Math.floor(d.base*rand(.85,1.15)),trend:ri(-8,12)}));}

function initA(){if(S.audio)return;try{S.audio=new(AudioContext||webkitAudioContext)}catch(e){}}
function startMusic(){
  initA();if(!S.audio||S.nodes)return;const ac=S.audio;if(ac.state==='suspended')ac.resume();
  const m=ac.createGain();m.gain.value=.045;m.connect(ac.destination);
  const chs=[[196,247,294],[220,277,330],[174,220,262]];let ci=0;
  const tick=()=>{chs[ci++%3].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.035,ac.currentTime+.4);g.gain.linearRampToValueAtTime(0,ac.currentTime+3.4);o.connect(g);g.connect(m);o.start();o.stop(ac.currentTime+3.6);});};
  tick();const iv=setInterval(tick,3400);
  const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.01;
  const n=ac.createBufferSource();n.buffer=buf;n.loop=1;const ng=ac.createGain();ng.gain.value=.22;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;n.connect(f);f.connect(ng);ng.connect(m);n.start();
  S.nodes={m,n,iv};
}
function stopMusic(){if(!S.nodes)return;try{clearInterval(S.nodes.iv);S.nodes.n.stop()}catch(e){}S.nodes=null;}
function toggleMusic(){S.musicOn=!S.musicOn;if(S.musicOn)startMusic();else stopMusic();toast(S.musicOn?'Nhạc bật':'Nhạc tắt');}
function sfx(t){if(!S.audio)return;const ac=S.audio,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=t==='coin'?900:t==='fail'?150:t==='hit'?280:t==='ok'?500:520;g.gain.value=.03;
  if(t==='fail')o.type='sawtooth';if(t==='hit')o.type='square';
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.11);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12);}

document.getElementById('mok').onclick=()=>{const v=document.getElementById('ni').value.trim();if(v){S.shopName=v.slice(0,16);toast('Tên: '+S.shopName);sfx('ok');}document.getElementById('modal').classList.remove('show');};
document.getElementById('mno').onclick=()=>document.getElementById('modal').classList.remove('show');
function openName(){document.getElementById('ni').value=S.shopName;document.getElementById('modal').classList.add('show');}

class Cust{
  constructor(slot){
    this.name=NAMES[ri(0,NAMES.length-1)];this.trait=TRAITS[ri(0,TRAITS.length-1)];
    this.slot=slot;this.state='enter';this.timer=0;this.maxWait=12*this.trait.w*waitM();
    this.item=genItem(S.event&&S.event.rare);
    const r=Math.random();this.want=r<.36?'sell':r<.62?'pawn':r<.86?'buy':'repair';
    this.skin=`hsl(${ri(18,38)},52%,${ri(72,84)}%)`;this.hair=`hsl(${ri(15,45)},40%,${ri(18,32)}%)`;
    this.shirt=`hsl(${ri(0,360)},60%,55%)`;this.emotion='neutral';this.alpha=0;this.bounce=0;this.budget=ri(400,2200);
    this.patience=3; // haggling rounds before leave
  }
}
function spawn(){
  if(!S.open||S.customers.length>=maxSlots())return;
  const used=S.customers.map(c=>c.slot),free=[];
  for(let i=0;i<maxSlots();i++)if(!used.includes(i))free.push(i);
  if(!free.length)return;
  S.customers.push(new Cust(free[ri(0,free.length-1)]));S.stats.cust++;
}
function openShop(){
  S.open=1;S.time=8;S.screen='shop';S.stats={rev:0,cost:0,mat:0,cust:0,deals:0,sold:0,repairs:0,fails:0};
  S.event=EVENTS[ri(0,EVENTS.length-1)];toast(S.event.t);burst(W/2,H*.22,PAL.green,12);if(S.musicOn)startMusic();sfx('ok');
}
function closeShop(){
  if(!S.open)return;S.open=0;S.customers.forEach(c=>c.state='leave');S.deal=null;S.repair=null;S.bubbles=[];
  refreshM();S.screen='summary';sfx('ok');
}

function startDeal(c){
  if(S.deal||S.repair)return;
  c.state='deal';c.emotion='think';
  let line,item,type=c.want;
  if(type==='buy'){
    if(!S.display.length){bubble(c,'Không có gì bán?');c.state='leave';c.emotion='angry';return;}
    item=S.display[ri(0,S.display.length-1)];
    S.deal={cust:c,item,type:'buy',player:Math.floor(item.market*.92),want:Math.floor(item.market*rand(.72,1.05)),
      phase:'talk',round:0,maxRound:c.patience,mood:1};
    line=pick(DIAL.buy);
  } else if(type==='repair'){
    item=c.item;
    S.deal={cust:c,item,type:'repair',player:Math.floor(item.base*.12*rand(.9,1.15)),want:0,phase:'talk',round:0,maxRound:2,mood:1};
    line=pick(DIAL.repair);
  } else {
    item=c.item;
    const m=item.market;
    const want=Math.floor(m*(type==='sell'?rand(.58,1.0):rand(.32,.55)));
    S.deal={cust:c,item,type,player:Math.floor(m*.4),want,phase:'talk',round:0,maxRound:c.patience,mood:1};
    line=type==='sell'?pick(DIAL.sell):pick(DIAL.pawn);
  }
  bubble(c,line,3.5);S.screen='deal';sfx('click');
}

// Multi-round haggling
function offerPrice(){
  const d=S.deal;if(!d||d.type==='repair')return;
  d.round++;
  const ratio=d.player/Math.max(1,d.want);
  // customer reaction
  if(d.type==='buy'){
    // selling TO customer — high price = harder
    if(ratio<=1.05){acceptDeal();return;}
    if(ratio<=1.2&&Math.random()<.55){acceptDeal();return;}
    if(d.round>=d.maxRound){bubble(d.cust,pick(['Thôi, đắt quá.','Không hợp.','Đi đây.']));d.cust.emotion='angry';d.cust.state='leave';S.deal=null;S.screen='shop';addReview(d.cust,ri(1,2));sfx('fail');return;}
    bubble(d.cust,pick(['Cao quá, giảm đi.','Hơi đắt...','Giảm chút được không?']));
    d.mood-=.3;d.cust.emotion='angry';
    // customer counter
    d.want=Math.floor(d.want*rand(.92,1.02));
  } else {
    // buying FROM customer — low offer = harder
    if(ratio>=.85){acceptDeal();return;}
    if(ratio>=.65&&Math.random()<.5/d.cust.trait.h){acceptDeal();return;}
    if(d.round>=d.maxRound){bubble(d.cust,pick(['Rẻ quá, thôi.','Không bán với giá này.','Đi đây.']));d.cust.emotion='angry';d.cust.state='leave';S.deal=null;S.screen='shop';addReview(d.cust,ri(1,2));sfx('fail');return;}
    bubble(d.cust,pick(['Thấp quá!','Cao hơn chút đi.','Không đồng ý giá này.']));
    d.mood-=.3;d.cust.emotion='angry';
    d.want=Math.floor(d.want*rand(.98,1.08)); // they raise expectation slightly
  }
  sfx('click');
}

function acceptDeal(){
  const d=S.deal;if(!d)return;const c=d.cust,p=d.player;
  if(d.type==='buy'){
    if(c.budget<p){bubble(c,'Không đủ tiền...');c.emotion='angry';c.state='leave';S.deal=null;S.screen='shop';return;}
    S.money+=p;S.stats.rev+=p;S.stats.sold++;S.display=S.display.filter(x=>x.uid!==d.item.uid);
    bubble(c,pick(['Ok chốt!','Lấy luôn!']));toast(`Bán +${p}k`);c.emotion='happy';addReview(c,ri(4,5));sfx('coin');burst(W/2,H*.3,PAL.green,10);
  } else if(d.type==='repair'){
    if(S.inv.length>=maxInv()){toast('Kho đầy!');return;}
    S.money+=p;S.stats.rev+=p;S.inv.push({...d.item,cost:0,owner:c.name,isCR:1});
    bubble(c,'Cảm ơn, qua lấy sau!');toast(`Nhận sửa +${p}k`);c.emotion='happy';sfx('ok');
  } else {
    if(S.money<p){toast('Thiếu tiền');return;}if(S.inv.length>=maxInv()){toast('Kho đầy!');return;}
    S.money-=p;S.stats.cost+=p;S.stats.deals++;
    const inv={...d.item,cost:p};
    if(d.type==='pawn'){inv.isPawn=1;inv.daysLeft=ri(2,5);inv.owner=c.name;bubble(c,`Chuộc trong ${inv.daysLeft} ngày.`);toast(`Cầm ${p}k`);}
    else {bubble(c,pick(['Ok!','Chốt!']));toast(`Mua ${p}k`);addReview(c,ri(4,5));}
    S.inv.push(inv);c.emotion='happy';sfx('coin');burst(W/2,H*.3,d.item.col,8);
  }
  setTimeout(()=>{c.state='leave';S.deal=null;S.screen='shop';},450);
}
function rejectDeal(){if(!S.deal)return;bubble(S.deal.cust,'Thôi vậy.');S.deal.cust.state='leave';S.deal.cust.emotion='angry';S.deal=null;S.screen='shop';sfx('click');}
function addReview(c,stars){S.reviews.unshift({name:c.name,stars,text:pick(RV[stars]||RV[3]),day:S.day,reply:null});if(S.reviews.length>25)S.reviews.pop();}

function startRepair(item){
  let ok=1;item.need.forEach(r=>{if((S.mats[r]||0)<1)ok=0;});
  if(!ok){toast('Thiếu vật liệu!');return;}
  if(item.tool&&!S.tools[item.tool]){toast('Thiếu dụng cụ!');return;}
  item.need.forEach(r=>S.mats[r]--);
  S.repair={item,si:0,steps:item.steps,done:0,need:item.steps[0].n,pieces:[],zones:[],hold:0,fails:0,anim:0,sparks:[],
    handPhase:0,hitFlash:0};
  setupStep();S.screen='minigame';S.handVis=1;sfx('ok');
}
function setupStep(){
  const j=S.repair;if(!j)return;const st=j.steps[j.si];
  j.done=0;j.need=st.n;j.hold=0;j.pieces=[];j.zones=[];j.anim=0;j.handPhase=0;
  if(st.t==='place'||st.t==='wire'){
    for(let i=0;i<st.n;i++){j.pieces.push({x:rand(40,W-40),y:H*.7+rand(0,25),placed:0,id:i});
      j.zones.push({x:W/2-45+i*30,y:H*.34,r:15});}
  }
}
function nextStep(){
  const j=S.repair;if(!j)return;j.si++;
  if(j.si>=j.steps.length){
    const fail=Math.max(.04,.28-S.skill*.025)+j.fails*.1;
    if(Math.random()<fail){j.item.condition=Math.max(5,j.item.condition-ri(8,18));toast('Chưa hoàn hảo');S.stats.fails++;S.skill=Math.min(10,S.skill+.1);sfx('fail');}
    else {j.item.condition=Math.min(100,j.item.condition+ri(28,48));j.item.repaired=1;
      toast(`✨ Xong → ${j.item.condition}%`);S.stats.repairs++;S.skill=Math.min(10,S.skill+.25);sfx('ok');burst(W/2,H*.38,PAL.green,14);}
    S.repair=null;S.handVis=0;S.screen='repair';return;
  }
  setupStep();
}
function buyFac(id){
  const f=FAC.find(x=>x.id===id);if(!f)return;const lv=S.fac[id]||0;if(lv>=f.max){toast('MAX');return;}
  const cost=f.costs[lv];if(S.money<cost){toast('Thiếu tiền');return;}
  S.money-=cost;S.fac[id]=lv+1;toast(`${f.name}: ${f.detail[lv]}`);burst(W/2,H*.28,PAL.orange,10);sfx('coin');
}
function buyLvl(){
  const n=SHOP_LV.find(l=>l.lvl===S.shopLvl+1);if(!n){toast('Max');return;}
  if(S.money<n.needM||rep()<n.needR){toast(`Cần ${n.needM}k & ${n.needR}★`);return;}
  S.money-=Math.floor(n.needM*.2);S.shopLvl=n.lvl;
  uMats().forEach(m=>{if((S.mats[m.k]||0)<2)S.mats[m.k]=ri(2,4);});
  toast(`🎉 ${n.name}`);burst(W/2,H*.28,PAL.orange,14);sfx('coin');
}

let last=performance.now(),spawnT=3;
function update(dt){
  S.anim+=dt;
  if(S.repair){
    S.repair.anim+=dt;S.repair.hitFlash=Math.max(0,S.repair.hitFlash-dt*4);
    S.repair.sparks=S.repair.sparks.filter(s=>{s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;return s.life>0;});
    // hand follows
    S.handX=lerp(S.handX,W/2+Math.sin(S.anim*2)*20,.1);
    S.handY=lerp(S.handY,H*.42+Math.sin(S.anim*3)*8,.1);
  }
  S.bubbles=S.bubbles.filter(b=>{b.life-=dt;return b.life>0;});
  if(S.screen!=='shop'&&S.screen!=='deal')return;
  if(S.open){
    S.time+=dt*.025;if(S.time>=20){closeShop();return;}
    spawnT-=dt;const mod=(S.event?S.event.m:1)*spawnM();
    if(spawnT<=0){spawn();spawnT=(8.5-rep())/mod+rand(.6,2.2);}
  }
  S.customers.forEach((c,i)=>{
    c.bounce=Math.sin(S.anim*3+i)*1.2;
    if(c.state==='enter'){c.alpha=lerp(c.alpha,1,1-Math.pow(.01,dt));if(c.alpha>.95){c.alpha=1;c.state='wait';c.timer=0;}}
    else if(c.state==='wait'){c.timer+=dt;if(c.timer>c.maxWait){c.state='leave';c.emotion='angry';toast(c.name+' bỏ đi');addReview(c,1);}}
    else if(c.state==='leave')c.alpha=lerp(c.alpha,0,1-Math.pow(.02,dt));
  });
  S.customers=S.customers.filter(c=>!(c.state==='leave'&&c.alpha<.05));
  for(let i=S.particles.length-1;i>=0;i--){const p=S.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;if(p.life<=0)S.particles.splice(i,1);}
}

// DRAW
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();}
function txt(s,x,y,sz,c,a='left'){ctx.font=`700 ${sz}px system-ui,-apple-system,sans-serif`;ctx.fillStyle=c;ctx.textAlign=a;ctx.fillText(s,x,y);}
function card(x,y,w,h,r,bg){
  ctx.fillStyle='rgba(100,60,40,.1)';ctx.beginPath();ctx.moveTo(x+r,y+3);ctx.arcTo(x+w,y+3,x+w,y+h+3,r);ctx.arcTo(x+w,y+h+3,x,y+h+3,r);ctx.arcTo(x,y+h+3,x,y+3,r);ctx.arcTo(x,y+3,x+w,y+3,r);ctx.fill();
  rr(x,y,w,h,r,bg||PAL.card);
}
function btn(x,y,w,h,r,c0,c1,label,fs=12){
  const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);
  rr(x,y,w,h,r,g);txt(label,x+w/2,y+h/2+fs*.32,fs,'#fff','center');
}

    ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fillStyle='#fff8e0';ctx.fill();

  else if(id==='typewriter'){rr(-15,-6,30,14,3,'#887868');rr(-11,-13,22,8,2,'#a09080');}

function drawHand(x,y,action){

function drawBubble(b){
  const c=b.c;if(!c||c.alpha<.3)return;
  const slots=maxSlots(),slotY=H*.48,slotW=(W-16-6*(slots-1))/slots;
  const sx=8+c.slot*(slotW+6)+slotW/2,sy=slotY;
  ctx.globalAlpha=clamp(b.life*2,0,1)*c.alpha;
  ctx.font='700 10px system-ui';
  const lines=[];let cur='';
  for(const ch of b.text){const t=cur+ch;if(ctx.measureText(t).width>slotW+8){lines.push(cur);cur=ch;}else cur=t;}
  if(cur)lines.push(cur);
  const bw=Math.min(slotW+20,Math.max(...lines.map(l=>ctx.measureText(l).width))+14);
  const bh=lines.length*13+10,bx=sx-bw/2,by=sy-bh-4;
  rr(bx,by,bw,bh,10,PAL.cream);
  ctx.strokeStyle='#e8b070';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(bx+8,by);ctx.arcTo(bx+bw,by,bx+bw,by+bh,10);ctx.arcTo(bx+bw,by+bh,bx,by+bh,10);ctx.arcTo(bx,by+bh,bx,by,10);ctx.arcTo(bx,by,bx+bw,by,10);ctx.stroke();
  ctx.fillStyle=PAL.cream;ctx.beginPath();ctx.moveTo(sx-5,by+bh);ctx.lineTo(sx,by+bh+5);ctx.lineTo(sx+5,by+bh);ctx.fill();
  lines.forEach((l,i)=>txt(l,sx,by+13+i*13,10,PAL.ink,'center'));
  ctx.globalAlpha=1;
}

function drawMinigame(){

  const j=S.repair;if(!j)return;

  txt('🔧 Xưởng sửa',W/2,32,14,'#f0e0d0','center');

  txt(`${j.done}/${j.need}`,W/2,95,10,'#8a7a98','center');

  // workbench
  rr(W/2-95,H*.22,190,145,16,'#3a2858');
  if(j.hitFlash>0){ctx.globalAlpha=j.hitFlash*.5;rr(W/2-90,H*.24,180,120,12,'#ffe080');ctx.globalAlpha=1;}
  drawIcon(j.item.id,W/2,H*.36,48);

  // HAND ANIMATION
  if(S.handVis)drawHand(S.handX||W/2+40,S.handY||H*.4,st.t);

  j.sparks.forEach(s=>{ctx.globalAlpha=s.life;rr(s.x,s.y,3,3,1.5,'#ffe880');});ctx.globalAlpha=1;

  if(['hold','unscrew','oil','tune','test','string','cut','stuff'].includes(st.t)){
    const R=46,cx=W/2,cy=H*.36;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='#4a3870';ctx.lineWidth=10;ctx.stroke();
    const prog=(j.done+j.hold)/j.need;
    ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(prog,0,1));
    ctx.strokeStyle=PAL.green;ctx.lineWidth=10;ctx.lineCap='round';ctx.stroke();
    const hint=st.t==='hold'?'🖐️ Cầm đồ — giữ tay':st.t==='unscrew'?'🔩 Gõ / vặn ốc — giữ':st.t==='oil'?'🛢️ Tra dầu — giữ':'Giữ để thao tác';
    txt(hint,W/2,H*.54,11,'#c0b0d0','center');
    btn(W/2-75,H*.6,150,44,14,PAL.green,PAL.green2,'✋ GIỮ',13);
  } else if(st.t==='sew'){
    const cx=W/2,cy=H*.36;
    const ringR=48*(1-((j.anim*.7)%1));
    ctx.beginPath();ctx.arc(cx,cy,Math.max(6,ringR),0,Math.PI*2);ctx.strokeStyle=PAL.pink;ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.strokeStyle=PAL.green;ctx.lineWidth=2;ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);
    txt('🧵 Ấn khi vòng chạm tâm',W/2,H*.54,11,'#c0b0d0','center');
    btn(W/2-75,H*.6,150,44,14,PAL.pink,'#c06090','KHÂU',13);
  } else if(st.t==='polish'){
    txt('✨ Vuốt qua lại để bóng',W/2,H*.54,11,'#c0b0d0','center');
    rr(28,H*.6,W-56,36,12,'#3a2858');
    const sx=28+((S.anim*40)%(W-100));
    rr(sx,H*.6+3,36,30,10,PAL.yellow);txt('↔',sx+18,H*.6+22,12,'#fff','center');
    for(let i=0;i<j.need;i++){ctx.beginPath();ctx.arc(W/2-30+i*18,H*.72,5,0,Math.PI*2);ctx.fillStyle=i<j.done?PAL.green:'#4a3870';ctx.fill();}
  } else if(st.t==='place'||st.t==='wire'){
    txt(st.t==='wire'?'⚡ Kéo dây vào điểm':'⚙️ Kéo linh kiện',W/2,H*.54,11,'#c0b0d0','center');
    j.zones.forEach((z,i)=>{
      ctx.strokeStyle=j.pieces[i]?.placed?PAL.green:'#6a5880';ctx.lineWidth=2;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    });
    j.pieces.forEach(p=>{if(p.placed)return;
      rr(p.x-11,p.y-11,22,22,6,st.t==='wire'?PAL.yellow:PAL.purple);
      txt(st.t==='wire'?'〜':'⚙',p.x,p.y+4,11,'#fff','center');
    });
  }
  if(j.fails)txt(`⚠️ Lỗi ${j.fails}`,W/2,H*.82,11,PAL.coral,'center');
}

    card(10,y,W-20,46,8,PAL.card);txt(f.name,20,y+16,10,PAL.ink);txt(lv<f.max?f.detail[lv]:'MAX',20,y+34,8,PAL.mute);
    if(lv<f.max){const c=f.costs[lv];btn(W-76,y+6,56,32,7,S.money>=c?PAL.green:'#d0b8a0',S.money>=c?PAL.green2:'#b09880',c+'k',9);}});}
  if(S.closedTab==='up'){const n=SHOP_LV.find(l=>l.lvl===S.shopLvl+1);

// INPUT
function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}
let holdIv=null,scrollStart=0,scrollY0=0,lastSwipe=0;
function onDown(e){
  e.preventDefault();const {x,y}=getPos(e);if(!S.audio){initA();if(S.musicOn)startMusic();}
  scrollStart=y;scrollY0=S.scroll;
  if(S.screen==='minigame'&&S.repair){
    const j=S.repair,st=j.steps[j.si];
    if(st.t==='place'||st.t==='wire'){j.pieces.forEach(p=>{if(!p.placed&&Math.hypot(x-p.x,y-p.y)<22)S.drag=p;});return;}
    if(st.t==='polish'){lastSwipe=x;return;}
    if(st.t==='sew'){
      const phase=(j.anim*.7)%1;if(phase>.75&&phase<.95){j.done++;sfx('ok');j.hitFlash=1;
        for(let k=0;k<5;k++)j.sparks.push({x:W/2,y:H*.36,vx:rand(-30,30),vy:rand(-40,-5),life:.35});
        if(j.done>=j.need)nextStep();}
      else {j.fails++;sfx('fail');}return;
    }
    if(y>H*.58&&y<H*.75){holdIv=setInterval(()=>{
      j.hold+=.12;j.hitFlash=.6;
      S.handY=H*.36+Math.sin(S.anim*10)*15;
      if(Math.random()<.3)j.sparks.push({x:W/2+rand(-20,20),y:H*.36+rand(-10,10),vx:rand(-20,20),vy:rand(-35,-5),life:.3});
      if(j.hold>=1){j.hold=0;j.done++;sfx('hit');if(j.done>=j.need)nextStep();}
    },60);}
    return;
  }
  onTap(x,y);
}
function onMove(e){
  const {x,y}=getPos(e);
  // scroll lists
  if(['inv','recipes','reviews','shopmat','facilities','upgrade','market'].includes(S.screen)&&!S.drag){
    S.scroll=Math.min(0,scrollY0+(y-scrollStart));
  }
  if(S.drag){S.drag.x=x;S.drag.y=y;return;}
  if(S.screen==='minigame'&&S.repair){
    const st=S.repair.steps[S.repair.si];
    if(st&&st.t==='polish'){
      if(Math.abs(x-lastSwipe)>20){lastSwipe=x;S.repair.done+=.15;S.repair.hitFlash=.4;
        S.repair.sparks.push({x,y:H*.62,vx:rand(-10,10),vy:rand(-25,-5),life:.25});
        if(S.repair.done>=S.repair.need){S.repair.done=S.repair.need;nextStep();}
      }
    }
  }
}
function onUp(){
  if(holdIv){clearInterval(holdIv);holdIv=null;if(S.repair)S.repair.hold=0;}
  if(S.drag&&S.repair){const j=S.repair,p=S.drag;
    j.zones.forEach((z,i)=>{if(!p.placed&&Math.hypot(p.x-z.x,p.y-z.y)<z.r+10){p.placed=1;p.x=z.x;p.y=z.y;j.done++;sfx('ok');j.hitFlash=1;
      for(let k=0;k<4;k++)j.sparks.push({x:z.x,y:z.y,vx:rand(-30,30),vy:rand(-40,-5),life:.35});if(j.done>=j.need)nextStep();}});
    S.drag=null;}
}
function onTap(x,y){
  if(S.screen==='home'){if(y>H*.5&&y<H*.65){S.screen='shop';toast('Chào mừng!');sfx('ok');}return;}
  if(S.screen==='summary'){if(y>H-100&&y<H-50){S.day++;S.time=8;S.open=0;S.screen='closed';S.closedTab='hub';
    S.inv.forEach(it=>{if(it.isPawn){it.daysLeft--;if(it.daysLeft<=0){it.isPawn=0;it.cost=Math.floor(it.cost*.4);toast(it.name+' hết hạn');
      S.reviews.unshift({name:it.owner,stars:ri(2,3),text:pick(RV[2]),day:S.day,reply:null});}}});
    refreshM();toast(`Ngày ${S.day}`);sfx('ok');}return;}
  if(y<50&&['shop','deal','closed'].includes(S.screen)){
    if(x>W-80&&x<W-50){openName();return;}
    if(x>W-50){toggleMusic();return;}
  }
  if(y>H-58&&!['home','summary','minigame'].includes(S.screen)){
    const g=W/4;if(x<g){S.screen=S.open?'shop':'closed';S.scroll=0;}
    else if(x<g*2){S.screen='inv';S.scroll=0;}else if(x<g*3){S.screen='repair';S.scroll=0;}else{S.screen='more';S.scroll=0;}return;}
  if(S.screen==='shop'){
    if(!S.open&&y>H*.38+55&&y<H*.38+100){openShop();return;}
    if(S.open&&x>W-75&&y>H*.38&&y<H*.38+28){closeShop();return;}
    if(S.open&&!S.deal){const slots=maxSlots(),slotY=H*.46,slotW=(W-16-6*(slots-1))/slots;
      for(let i=0;i<slots;i++){const sx=8+i*(slotW+6);const c=S.customers.find(cu=>cu.slot===i);
        if(c&&c.state==='wait'&&x>sx&&x<sx+slotW&&y>slotY&&y<slotY+110){startDeal(c);return;}}}return;}
  if(S.screen==='deal'&&S.deal){
    const d=S.deal,py=H*.38;
    if(d.phase==='talk'){
      if(y>py+150&&y<py+200){if(x<W/2){d.phase='price';bubble(d.cust,'Ok, nói giá đi.');}else rejectDeal();}
    } else if(d.type==='repair'){
      if(y>py+150&&y<py+200)acceptDeal();if(y>py+200&&y<py+245)rejectDeal();
    } else {
      const by=py+180;
      if(y>by&&y<by+32){
        if(x>10&&x<54)d.player=Math.max(10,d.player-50);
        if(x>58&&x<102)d.player=Math.max(10,d.player-10);
        if(x>106&&x<150)d.player+=10;
        if(x>154&&x<198)d.player+=50;
        if(x>W-130&&x<W-72)acceptDeal();
        if(x>W-70&&x<W-16)rejectDeal();
      }
      if(y>by+35&&y<by+70&&x>W/2-60&&x<W/2+60)offerPrice();
    }return;}
  if(S.screen==='closed'){
    const tw=(W-10)/5;if(y>48&&y<76){const tabs=['hub','market','display','fac','up'];const i=Math.floor((x-5)/tw);if(i>=0&&i<5)S.closedTab=tabs[i];return;}
    if(S.closedTab==='hub'&&y>H-130&&y<H-80){openShop();return;}
    if(S.closedTab==='display'){
      S.display.forEach((it,i)=>{const dx=10+(i%3)*((W-28)/3),dy=100+Math.floor(i/3)*52;
        if(x>dx&&x<dx+(W-34)/3&&y>dy&&y<dy+44){S.inv.push(it);S.display=S.display.filter(a=>a.uid!==it.uid);}});
      let yi=230;S.inv.filter(it=>!it.isPawn&&(it.repaired||it.condition>55)).forEach(it=>{if(yi>H-70)return;
        if(y>yi&&y<yi+28&&x>W-70){if(S.display.length>=maxDisp()){toast('Tủ đầy');return;}S.display.push(it);S.inv=S.inv.filter(a=>a.uid!==it.uid);toast('Trưng');sfx('ok');}yi+=32;});}
    if(S.closedTab==='fac')FAC.forEach((f,i)=>{if(y>82+i*52&&y<128+i*52&&x>W-80)buyFac(f.id);});
    if(S.closedTab==='up'&&y>155&&y<200)buyLvl();return;}
  if(S.screen==='inv'){if(x<42&&y<48){S.screen=S.open?'shop':'closed';return;}
    S.inv.forEach((it,i)=>{const iy=54+S.scroll+i*66;if(x>W-82&&y>iy+8&&y<iy+50){
      if(!it.repaired&&!it.isPawn)S.screen='repair';
      else if(!it.isPawn&&!it.isCR){if(S.display.length>=maxDisp()){toast('Tủ đầy');return;}S.display.push(it);S.inv=S.inv.filter(a=>a.uid!==it.uid);toast('Trưng');sfx('ok');}}});return;}
  if(S.screen==='repair'){if(x<42&&y<48){S.screen=S.open?'shop':'closed';return;}if(x>W-95&&y>50&&y<80){S.screen='recipes';return;}
    S.inv.filter(it=>!it.repaired&&!it.isPawn).forEach((it,i)=>{const iy=88+i*74;if(x>W-90&&y>iy+10&&y<iy+60)startRepair(it);});return;}
  if(S.screen==='recipes'){if(x<42&&y<48)S.screen='repair';return;}
  if(S.screen==='shopmat'){if(x<42&&y<48){S.screen='more';return;}if(y>50&&y<80){S._tab=x<W/2?'mats':'tools';return;}
    if(S._tab!=='tools'){uMats().forEach((m,i)=>{const iy=86+i*42;if(x>W-78&&y>iy&&y<iy+36){
      if(S.money>=m.price){S.money-=m.price;S.mats[m.k]=(S.mats[m.k]||0)+1;S.stats.mat+=m.price;toast('Mua '+m.name);sfx('coin');}else toast('Thiếu tiền');}});}
    else{TOOLS.forEach((t,i)=>{const iy=86+i*56;if(!S.tools[t.id]&&x>W-85&&y>iy&&y<iy+50){
      if(S.money>=t.price){S.money-=t.price;S.tools[t.id]=1;toast('Mua '+t.name);sfx('coin');}else toast('Thiếu tiền');}});}return;}
  if(S.screen==='market'){if(x<42&&y<48)S.screen='more';return;}
  if(S.screen==='facilities'){if(x<42&&y<48){S.screen='more';return;}FAC.forEach((f,i)=>{if(y>52+i*66&&y<108+i*66&&x>W-90)buyFac(f.id);});return;}
  if(S.screen==='upgrade'){if(x<42&&y<48){S.screen='more';return;}const n=SHOP_LV.find(l=>l.lvl===S.shopLvl+1);if(n){const iy=52+(n.lvl-1)*80;if(y>iy+30&&y<iy+70&&x>W-95)buyLvl();}return;}
  if(S.screen==='reviews'){if(x<42&&y<48){S.screen='more';return;}
    S.reviews.forEach((r,i)=>{const iy=144+i*68;if(!r.reply&&x>W-95&&y>iy+40&&y<iy+62){r.reply=pick(['Cảm ơn!','Xin lỗi nha!','Love u']);toast('Đã phản hồi');sfx('ok');}});return;}
  if(S.screen==='more'){
    if(x<42&&y<48){S.screen=S.open?'shop':'closed';return;}
    if(y>52&&y<100){openName();return;}
    const ids=['shopmat','recipes','market','facilities','upgrade','reviews'];
    ids.forEach((id,i)=>{if(y>106+i*60&&y<156+i*60){S.screen=id;if(id==='shopmat')S._tab='mats';S.scroll=0;sfx('click');}});
  }
}

canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});canvas.addEventListener('touchmove',onMove,{passive:false});canvas.addEventListener('touchend',onUp);
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function render(){
  ctx.clearRect(0,0,W,H);
  if(S.screen==='home')drawHome();
  else if(S.screen==='summary')drawSummary();
  else if(S.screen==='closed'){drawClosed();drawNav('closed');}
  else if(S.screen==='inv'){drawInv();drawNav('inv');}
  else if(S.screen==='repair'){drawRepair();drawNav('repair');}
  else if(S.screen==='minigame')drawMinigame();
  else if(S.screen==='recipes'){drawRecipes();drawNav('repair');}
  else if(S.screen==='shopmat'){drawShopMat();drawNav('more');}
  else if(S.screen==='market'){drawMarket();drawNav('more');}
  else if(S.screen==='facilities'){drawFac();drawNav('more');}
  else if(S.screen==='upgrade'){drawUp();drawNav('more');}
  else if(S.screen==='reviews'){drawReviews();drawNav('more');}
  else if(S.screen==='more'){drawMore();drawNav('more');}
  else if(S.screen==='deal'){drawDeal();drawNav('deal');}
  else{drawShop();drawTop();drawNav('shop');}
}
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;try{update(dt);render();}catch(e){console.error(e);ctx.fillStyle='#f5dcc8';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c00';ctx.font='11px sans-serif';ctx.fillText(e.message,10,40);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
