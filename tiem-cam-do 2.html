body{height:100%;margin:0;background:#1c120b;font:20px/1.15 VT323,monospace;color:var(--ink)}
#app{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column}
#top{display:flex;justify-content:space-between;padding:5px 10px;background:#4a2f1a;color:#ffe9b0;font-size:22px;border-bottom:3px solid #2a1a0c}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}
canvas{width:100%;image-rendering:pixelated;display:block;background:#000}
#dlg{flex:1;overflow:auto;background:var(--paper);border-top:4px solid #2a1a0c;padding:8px 10px}
#nav{display:flex;background:#4a2f1a;border-top:3px solid #2a1a0c}
#nav button{flex:1;border:0;border-radius:0;box-shadow:none;background:none;padding:3px 0;font-size:14px;color:#ffe9b0}
#nav button span{display:block;font-size:22px}
#nav button.on{background:#7a4a20}
button{font:inherit;background:var(--btn);color:#fff3d6;border:3px solid #2a1a0c;border-radius:6px;padding:1px 9px;box-shadow:0 3px 0 #2a1a0c;cursor:pointer;margin:2px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1a0c}
button:disabled{opacity:.45}
.big{font-size:28px;width:100%;padding:6px;background:var(--ok)}
.red{background:#b04040}
input{font:inherit;width:74px;border:3px solid #2a1a0c;border-radius:4px;background:#fffaf0;padding:1px 4px;color:var(--ink)}
input.w{width:calc(100% - 90px)}
.row{display:flex;justify-content:space-between;gap:6px;border-bottom:2px dashed #b89a68;padding:4px 0;align-items:center;flex-wrap:wrap}
.card{background:#fffaf0;border:3px solid #2a1a0c;border-radius:6px;padding:6px;margin:6px 0}
.ln{display:block;font-size:22px;margin:2px 0 4px}
h3{margin:0 0 4px;font-size:25px}
small{font-size:17px;opacity:.85}
.bar{height:10px;background:#d7c39a;border:2px solid #2a1a0c;border-radius:5px}
.bar i{display:block;height:100%;background:var(--ok)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 36px);left:50%;transform:translateX(-50%);max-width:88%;background:#fff3d6;border:3px solid #2a1a0c;border-radius:8px;padding:4px 10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;text-align:center}
#top{font-size:18px}
</style></head><body>
<div id="toast"></div><div id="app">

reply=function(i){const t=$('#rp'+i).value.trim();if(!t)return;const r=G.rev[i],n=r.npc,ag=n.ask>=1.05||n.flex>=.88,bad=BADR.test(t),sar=!bad&&SARR.test(t),good=!bad&&!sar&&/(cảm ơn|xin lỗi|hoan nghênh|quay lại|mong|chúc|rất tiếc|thân|hoàn tiền|gửi lời)/i.test(t);r.rp=t;
